name: Release

on:
  workflow_dispatch:

concurrency:
  # workflow_ref (unlike workflow name) differs per called workflow, avoiding a
  # deadlock where linux/windows/android.yml would otherwise share this group.
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

# Ceiling for all called workflows below; each nested job further narrows what it actually uses.
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  security-events: write
  checks: write

jobs:
  build-linux:
    name: Build Linux
    uses: ./.github/workflows/linux.yml
    with:
      concurrency-suffix: linux
    secrets: inherit

  build-windows:
    name: Build Windows
    uses: ./.github/workflows/windows.yml
    with:
      concurrency-suffix: windows
    secrets: inherit

  build-android:
    name: Build Android
    uses: ./.github/workflows/android.yml
    with:
      concurrency-suffix: android
      primary-only: true
    secrets: inherit

  # Only runs if all three builds succeed; the workflow fails otherwise.
  release:
    name: Publish MAVTech Release
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version, tag and changelog
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/Stable_V*:refs/remotes/origin/Stable_V*'
          stable_branch=$(git for-each-ref --format='%(refname:strip=3)' --sort=-version:refname 'refs/remotes/origin/Stable_V*' | head -n1)

          base_version="v${stable_branch#Stable_V}"
          merge_base=$(git merge-base HEAD "origin/${stable_branch}")

          date_display=$(date -u +%Y.%m.%d)
          date_tag=$(date -u +%Y%m%d)

          {
            echo "suffix=${base_version}-${date_tag}"
            echo "tag_name=${base_version}-mavtech.${date_tag}"
            echo "title=QGroundControl ${base_version} - MAVTech Build ${date_display}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Modifiche rispetto a ${stable_branch}"
            echo
            git log --pretty=format:"- %s%n > %b" "${merge_base}..HEAD" --grep="workflow" -i --invert-grep
          } > changelog.md
          cat changelog.md

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f || echo "No artifacts found"

      # Append the MAVTech version+date suffix to every release asset filename.
      - name: Rename artifacts with release suffix
        shell: bash
        env:
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          set -euo pipefail

          mkdir -p release-assets

          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.apk' \) -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "${f}")"
              cp "${f}" "release-assets/MAVTech_${base%.*}_${SUFFIX}.${base##*.}"
            done

          find release-assets -type f

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.title }}
          body_path: changelog.md
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true
